<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="layerFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00ffee" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Layered architecture stack -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="90" y="120" width="320" height="56" rx="10" fill="url(#layerFill)" stroke="#00ffee" stroke-width="1.5" opacity="0.95"/>
    <text x="250" y="155" fill="#00ffee" text-anchor="middle" letter-spacing="1">API</text>

    <rect x="90" y="196" width="320" height="56" rx="10" fill="url(#layerFill)" stroke="#00ffee" stroke-width="1.5" opacity="0.85"/>
    <text x="250" y="231" fill="#e8ffff" text-anchor="middle" letter-spacing="1">APPLICATION</text>

    <rect x="90" y="272" width="320" height="56" rx="10" fill="url(#layerFill)" stroke="#00ffee" stroke-width="1.5" opacity="0.75"/>
    <text x="250" y="307" fill="#e8ffff" text-anchor="middle" letter-spacing="1">DOMAIN</text>

    <rect x="90" y="348" width="320" height="56" rx="10" fill="url(#layerFill)" stroke="#00ffee" stroke-width="1.5" opacity="0.65"/>
    <text x="250" y="383" fill="#e8ffff" text-anchor="middle" letter-spacing="1">INFRASTRUCTURE</text>
  </g>

  <!-- connecting glow line -->
  <line x1="250" y1="176" x2="250" y2="348" stroke="#00ffee" stroke-width="1" opacity="0.25"/>

  <text x="250" y="70" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="1">PaymentSystem</text>
  <text x="250" y="96" fill="#00ffee" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="3">C# · ASP.NET CORE · SQL SERVER</text>

  <text x="250" y="450" fill="#888" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" letter-spacing="1">Layered Architecture Backend</text>
</svg>
